# КлассЗапроса=КлассОтвета:поле=поле,поле!=поле;ДругойКлассОтвета#вариант:поле=поле
# Подробное описание формата: ModelComparisonConfig

# пользователь: ответ создания, элемент списка админа и профиль (пароль в ответе хранится хэшем)
CreateUserRequest=CreateUserResponse:username,role,password!=password;CustomerProfile:username,role,password!=password

# счёт: создание и запись в профиле
CreateAccountResponse=CreateAccountResponse:id,accountNumber,balance

# пополнение: счёт в ответе/профиле и транзакция DEPOSIT (relatedAccountId = id счёта)
DepositRequest=CreateAccountResponse:id,balance;TransactionData:balance=amount,id=relatedAccountId

# перевод: ответ и транзакции: у отправителя related = получатель, у получателя related = отправитель
TransferRequest=TransferResponse:senderAccountId,receiverAccountId,amount;TransactionData#out:amount,receiverAccountId=relatedAccountId;TransactionData#in:amount,senderAccountId=relatedAccountId

# обновление имени: ответ (вложенное поле) и профиль
UpdateProfileRequest=UpdateProfileResponse:name=customer.name;CustomerProfile:name